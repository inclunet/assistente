baseURL = 'https://inclunet.github.io/assistente/'
languageCode = 'pt-BR'
defaultContentLanguage = 'pt-br'
title = 'Assistente'
disablePathToLower = true

[module]
  [[module.imports]]
    path = 'github.com/McShelby/hugo-theme-relearn'

[params]
  themeVariant = ['auto', 'relearn-dark', 'relearn-light']
  editURL = 'https://github.com/inclunet/assistente/edit/main/docs/content/${FilePath}'
  showVisitedLinks = true
  disableLandingPageButton = true
  titleSeparator = '—'
  customCSS = ['css/custom.css']
  alwaysopen = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    style = 'monokai'
