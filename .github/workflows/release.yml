name: Release

on:
  release:
    types: [created] # Trigger quando criar release com gh release create

permissions:
  contents: write # Necessário para fazer upload de assets

jobs:
  build:
    strategy:
      matrix:
        include:
          # Windows apenas (testando)
          - os: windows-latest
            platform: windows/amd64
            goos: windows
            goarch: amd64
            output: assistente.exe
            
          # macOS Intel (desabilitado temporariamente)
          # - os: macos-latest
          #   platform: darwin/amd64
          #   goos: darwin
          #   goarch: amd64
          #   output: assistente
            
          # macOS Apple Silicon (desabilitado temporariamente)
          # - os: macos-latest
          #   platform: darwin/arm64
          #   goos: darwin
          #   goarch: arm64
          #   output: assistente
            
          # Linux (desabilitado temporariamente)
          # - os: ubuntu-22.04
          #   platform: linux/amd64
          #   goos: linux
          #   goarch: amd64
          #   output: assistente

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Verify Wails Installation
        run: |
          wails version
          wails doctor

      - name: Install NSIS (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install nsis -y
          # Adiciona NSIS ao PATH
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Install dependencies (Linux)
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          # Instala dependências base
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev
          # Tenta instalar libwebkit2gtk-4.1-dev (Ubuntu 22.04+), se falhar tenta 4.0-dev
          sudo apt-get install -y libwebkit2gtk-4.1-dev || sudo apt-get install -y libwebkit2gtk-4.0-dev
          # Instala bibliotecas X11 para suporte a clipboard/hotkey
          sudo apt-get install -y xorg-dev libx11-dev libxkbcommon-dev libxext-dev
          # Instala xvfb para criar display virtual (necessário para builds headless)
          sudo apt-get install -y xvfb
          
          # Configura PKG_CONFIG_PATH para incluir diretórios comuns
          echo "PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          
          # Verifica se webkit foi instalado corretamente
          echo "📦 Verificando instalação do webkit2gtk..."
          pkg-config --list-all | grep webkit || echo "⚠️ webkit2gtk não encontrado no pkg-config"
          find /usr -name "webkit2gtk*.pc" 2>/dev/null || echo "⚠️ Arquivo .pc do webkit2gtk não encontrado"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build application
        shell: bash
        run: |
          echo "🏗️ Building for ${{ matrix.platform }}..."
          wails build -platform ${{ matrix.platform }} -clean
          echo "✅ Build completed"
          echo "📂 Build output:"
          if [ -d "build/bin" ]; then
            ls -la build/bin/
          else
            echo "⚠️ build/bin/ not found"
          fi

      - name: Build installer (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          echo "🚪 Building Windows installer..."
          # Não usa -clean para não apagar o executável já gerado
          wails build -platform ${{ matrix.platform }} -nsis
          echo "✅ Installer build completed"
          echo "📂 Installer output:"
          if [ -d "build/bin" ]; then
            ls -la build/bin/
          else
            echo "⚠️ build/bin/ not found"
          fi

      - name: Build installer (macOS)
        if: matrix.goos == 'darwin'
        continue-on-error: true
        run: |
          echo "🍎 Building macOS package..."
          # Builda executável primeiro
          wails build -platform ${{ matrix.platform }} -clean
          echo "Build completed. Files in build/bin/:"
          ls -lh build/bin/ || true
          # Cria DMG
          # Nota: pode precisar de create-dmg ou outro tool
          # Por enquanto, assumindo que Wails gera automaticamente

      - name: Build packages (Linux)
        if: matrix.goos == 'linux'
        continue-on-error: true
        run: |
          echo "🐧 Building Linux packages..."
          # AppImage (automático com Wails)
          xvfb-run wails build -platform ${{ matrix.platform }} -clean
          echo "Build completed. Files in build/bin/:"
          ls -lh build/bin/ || true
          
          # Opcional: gerar .deb também
          # xvfb-run wails build -platform ${{ matrix.platform }} -deb

      - name: Prepare artifacts
        shell: bash
        run: |
          # Obtém versão da tag
          VERSION=${GITHUB_REF#refs/tags/v}
          ARTIFACT_NAME="assistente-${{ matrix.goos }}-${{ matrix.goarch }}"
          
          echo "📦 Preparing artifacts for ${ARTIFACT_NAME}..."
          echo "Version: ${VERSION}"
          
          mkdir -p artifacts
          
          echo "📂 Content of build/bin/:"
          ls -lah build/bin/ || echo "⚠️ build/bin/ directory not found!"
          
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            echo "🪟 Processing Windows artifacts..."
            
            # Lista todos os .exe para debug
            echo "📋 All .exe files in build/bin/:"
            find build/bin -name "*.exe" -type f || true
            
            # Windows: executável + instalador NSIS
            if [ -f "build/bin/${{ matrix.output }}" ]; then
              echo "✅ Found executable: build/bin/${{ matrix.output }}"
              cp build/bin/${{ matrix.output }} artifacts/${ARTIFACT_NAME}.exe
            else
              echo "⚠️ Executable not found at: build/bin/${{ matrix.output }}"
            fi
            
            # Instalador NSIS - tenta vários padrões de nome
            INSTALLER_FOUND=false
            for installer in "build/bin/assistente-amd64-installer.exe" "build/bin/Assistente-Installer.exe" "build/bin/assistente-installer.exe" "build/bin/assistente-windows-amd64-installer.exe" "build/bin/"*-installer.exe "build/bin/"*Installer.exe; do
              if [ -f "$installer" ]; then
                echo "✅ Found installer: $installer"
                cp "$installer" artifacts/${ARTIFACT_NAME}-installer.exe
                INSTALLER_FOUND=true
                break
              fi
            done
            
            if [ "$INSTALLER_FOUND" = "false" ]; then
              echo "⚠️ No installer found. Build may have failed or NSIS not configured."
            fi
            
          elif [ "${{ matrix.goos }}" = "darwin" ]; then
            echo "🍎 Processing macOS artifacts..."
            
            # macOS: executável + DMG
            if [ -f "build/bin/${{ matrix.output }}" ]; then
              echo "✅ Found executable: build/bin/${{ matrix.output }}"
              cp build/bin/${{ matrix.output }} artifacts/${ARTIFACT_NAME}
              chmod +x artifacts/${ARTIFACT_NAME}
            else
              echo "⚠️ Executable not found at: build/bin/${{ matrix.output }}"
            fi
            
            # DMG
            for dmg in "build/bin/assistente.dmg" "build/bin/Assistente.dmg" "build/bin/assistente-${{ matrix.goarch }}.dmg"; do
              if [ -f "$dmg" ]; then
                echo "✅ Found DMG: $dmg"
                cp "$dmg" artifacts/${ARTIFACT_NAME}.dmg
                break
              fi
            done
            
          else
            echo "🐧 Processing Linux artifacts..."
            
            # Linux: executável + AppImage
            if [ -f "build/bin/${{ matrix.output }}" ]; then
              echo "✅ Found executable: build/bin/${{ matrix.output }}"
              cp build/bin/${{ matrix.output }} artifacts/${ARTIFACT_NAME}
              chmod +x artifacts/${ARTIFACT_NAME}
            else
              echo "⚠️ Executable not found at: build/bin/${{ matrix.output }}"
            fi
            
            # AppImage
            for appimage in "build/bin/assistente.AppImage" "build/bin/Assistente.AppImage" "build/bin/assistente-amd64.AppImage"; do
              if [ -f "$appimage" ]; then
                echo "✅ Found AppImage: $appimage"
                cp "$appimage" artifacts/${ARTIFACT_NAME}.AppImage
                chmod +x artifacts/${ARTIFACT_NAME}.AppImage
                break
              fi
            done
            
            # .deb se existir
            if [ -f "build/bin/assistente.deb" ]; then
              echo "✅ Found .deb: build/bin/assistente.deb"
              cp build/bin/assistente.deb artifacts/${ARTIFACT_NAME}.deb
            fi
          fi
          
          echo "📋 Final artifacts:"
          ls -lah artifacts/

      - name: Calculate checksums
        shell: bash
        working-directory: artifacts
        run: |
          for file in *; do
            [ -f "$file" ] && sha256sum "$file" >> checksums.txt
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.goos }}-${{ matrix.goarch }}
          path: artifacts/*

  release:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          
          # Consolida todos os builds
          echo "📦 Consolidando artifacts..."
          for dir in artifacts/build-*; do
            if [ -d "$dir" ]; then
              echo "Copiando de $dir"
              find "$dir" -type f -exec cp {} release-assets/ \;
            fi
          done
          
          # Remove checksums individuais e cria um consolidado
          rm -f release-assets/checksums.txt
          
          # Lista arquivos
          echo "📋 Arquivos preparados:"
          ls -lh release-assets/
          
          # Gera checksums consolidados
          echo "🔐 Gerando checksums..."
          cd release-assets
          for file in *; do
            if [ -f "$file" ]; then
              sha256sum "$file" >> checksums.txt
            fi
          done
          cat checksums.txt

      # Manifest não é mais necessário - o updater busca diretamente da API do GitHub

      - name: Verify release assets
        run: |
          echo "✅ Verificando assets..."
          if [ -z "$(ls -A release-assets)" ]; then
            echo "❌ ERRO: Nenhum asset encontrado em release-assets/"
            exit 1
          fi
          echo "Assets encontrados:"
          ls -lh release-assets/

      - name: Upload assets to existing release
        uses: softprops/action-gh-release@v1
        with:
          files: release-assets/*
          fail_on_unmatched_files: true

      # Push para GitHub Pages não é mais necessário

      - name: Summary
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          
          echo "✅ Release ${VERSION} publicado!"
          echo ""
          echo "📦 GitHub Release: https://github.com/inclunet/assistente/releases/tag/${VERSION}"
          echo "🔄 Auto-update detectará a nova versão automaticamente via GitHub API"