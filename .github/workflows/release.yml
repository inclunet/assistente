name: Release

on:
  release:
    types: [created] # Trigger quando criar release com gh release create

permissions:
  contents: write # Necessário para fazer upload de assets

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev xvfb

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

      - name: Go build
        run: go build ./...

      - name: Go tests
        run: |
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          export DISPLAY=:99.0
          go test ./...

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Stylelint
        working-directory: frontend
        run: npm run lint:css

      - name: Frontend tests
        working-directory: frontend
        run: npm run test

  build-cli:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            ext: ""
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
          - os: macos-latest
            goos: darwin
            goarch: amd64
            ext: ""
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build CLI
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          LDFLAGS="-X main.AppVersion=$VERSION"
          OUTPUT="asst-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"

          echo "Building CLI: $OUTPUT"
          go build -ldflags "$LDFLAGS" -o "$OUTPUT" ./cmd/asst/
          echo "CLI build OK"

          mkdir -p artifacts
          mv "$OUTPUT" artifacts/

      - name: Calculate checksum
        shell: bash
        working-directory: artifacts
        run: |
          for file in *; do
            if [ -f "$file" ]; then
              if command -v sha256sum &> /dev/null; then
                sha256sum "$file" > "${file}.sha256"
              else
                shasum -a 256 "$file" > "${file}.sha256"
              fi
            fi
          done

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: artifacts/*

  build:
    needs: test
    strategy:
      matrix:
        include:
          # Windows
          - os: windows-latest
            platform: windows/amd64
            goos: windows
            goarch: amd64
            output: assistente.exe
            
          # Linux
          - os: ubuntu-latest
            platform: linux/amd64
            goos: linux
            goarch: amd64
            output: assistente

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Verify Wails Installation
        run: |
          wails version
          wails doctor

      - name: Install NSIS (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install nsis -y
          # Adiciona NSIS ao PATH
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Install dependencies (Linux)
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          # Instala dependências base
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev
          # Tenta instalar libwebkit2gtk-4.1-dev (Ubuntu 22.04+), se falhar tenta 4.0-dev
          sudo apt-get install -y libwebkit2gtk-4.1-dev || sudo apt-get install -y libwebkit2gtk-4.0-dev
          # Instala bibliotecas X11 para suporte a clipboard/hotkey
          sudo apt-get install -y xorg-dev libx11-dev libxkbcommon-dev libxext-dev
          # Instala xvfb para criar display virtual (necessário para builds headless)
          sudo apt-get install -y xvfb
          
          # Configura PKG_CONFIG_PATH para incluir diretórios comuns
          echo "PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          
          # Cria link simbólico para webkit2gtk-4.0 se necessário (Ubuntu 22.04+ tem apenas 4.1)
          if [ ! -f /usr/lib/x86_64-linux-gnu/pkgconfig/webkit2gtk-4.0.pc ] && [ -f /usr/lib/x86_64-linux-gnu/pkgconfig/webkit2gtk-4.1.pc ]; then
            echo "🔗 Criando link simbólico webkit2gtk-4.0.pc -> webkit2gtk-4.1.pc"
            sudo ln -s /usr/lib/x86_64-linux-gnu/pkgconfig/webkit2gtk-4.1.pc /usr/lib/x86_64-linux-gnu/pkgconfig/webkit2gtk-4.0.pc
          fi
          
          # Verifica se webkit foi instalado corretamente
          echo "📦 Verificando instalação do webkit2gtk..."
          pkg-config --list-all | grep webkit || echo "⚠️ webkit2gtk não encontrado no pkg-config"
          pkg-config --exists webkit2gtk-4.0 && echo "✅ webkit2gtk-4.0 encontrado" || echo "⚠️ webkit2gtk-4.0 NÃO encontrado"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build application
        shell: bash
        run: |
          echo "🏗️ Building for ${{ matrix.platform }}..."
          
          # Extrai versão da tag (remove 'v' se existir)
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          echo "📌 Version: $VERSION"
          
          # Prepara ldflags para injetar a versão
          LDFLAGS="-X main.AppVersion=$VERSION"
          echo "🔧 Using ldflags: $LDFLAGS"
          
          if [ "${{ matrix.goos }}" = "linux" ]; then
            # Usa xvfb-run para criar display virtual no Linux
            xvfb-run wails build -platform ${{ matrix.platform }} -ldflags "$LDFLAGS" -clean
          else
            wails build -platform ${{ matrix.platform }} -ldflags "$LDFLAGS" -clean
          fi
          echo "✅ Build completed"
          echo "📂 Build output:"
          if [ -d "build/bin" ]; then
            ls -la build/bin/
          else
            echo "⚠️ build/bin/ not found"
          fi

      - name: Build installer (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          echo "🚪 Building Windows installer..."
          
          # Extrai versão da tag
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          
          # Prepara ldflags para injetar a versão
          LDFLAGS="-X main.AppVersion=$VERSION"
          
          # Não usa -clean para não apagar o executável já gerado
          wails build -platform ${{ matrix.platform }} -ldflags "$LDFLAGS" -nsis
          echo "✅ Installer build completed"
          echo "📂 Installer output:"
          if [ -d "build/bin" ]; then
            ls -la build/bin/
          else
            echo "⚠️ build/bin/ not found"
          fi

      - name: Build packages (Linux)
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          echo "🐧 Criando AppImage para Linux..."
          
          # Lista arquivos atuais
          echo "📂 Arquivos em build/bin/:"
          ls -lah build/bin/ || true
          
          # Instala linuxdeploy para criar AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy
          chmod +x linuxdeploy
          
          # Cria estrutura AppDir
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          
          # Copia executável
          cp build/bin/assistente AppDir/usr/bin/
          
          # Cria arquivo .desktop
          cat > AppDir/usr/share/applications/assistente.desktop << 'EOF'
          [Desktop Entry]
          Name=Assistente
          Exec=assistente
          Icon=assistente
          Type=Application
          Categories=Utility;
          Terminal=false
          EOF
          
          # Copia ícone (se existir, senão usa um placeholder)
          if [ -f "build/appicon.png" ]; then
            cp build/appicon.png AppDir/usr/share/icons/hicolor/256x256/apps/assistente.png
          elif [ -f "build/linux/icon.png" ]; then
            cp build/linux/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/assistente.png
          else
            # Cria um ícone simples placeholder
            convert -size 256x256 xc:blue -pointsize 48 -fill white -gravity center -annotate +0+0 "A" AppDir/usr/share/icons/hicolor/256x256/apps/assistente.png || \
            echo "⚠️ Imagemagick não disponível, AppImage será criado sem ícone"
          fi
          
          # Gera AppImage
          OUTPUT=assistente-x86_64.AppImage ./linuxdeploy --appdir AppDir --output appimage
          
          # Move para build/bin
          if [ -f "assistente-x86_64.AppImage" ]; then
            mv assistente-x86_64.AppImage build/bin/
            echo "✅ AppImage criado com sucesso!"
          else
            echo "⚠️ Falha ao criar AppImage"
          fi
          
          # Lista arquivos finais
          echo "📂 Arquivos finais em build/bin/:"
          ls -lah build/bin/ || true

      - name: Prepare artifacts
        shell: bash
        run: |
          # Obtém versão da tag
          VERSION=${GITHUB_REF#refs/tags/v}
          ARTIFACT_NAME="assistente-${{ matrix.goos }}-${{ matrix.goarch }}"
          
          echo "================================"
          echo "🔍 DEBUG COMPLETO: ${{ matrix.goos }}-${{ matrix.goarch }}"
          echo "================================"
          echo "📦 Artifact name: ${ARTIFACT_NAME}"
          echo "🏷️  Version: ${VERSION}"
          echo "💻 matrix.os: ${{ matrix.os }}"
          echo "🎯 matrix.goos: ${{ matrix.goos }}"
          echo "🔢 matrix.goarch: ${{ matrix.goarch }}"
          echo "📤 matrix.output: ${{ matrix.output }}"
          echo "================================"
          
          mkdir -p artifacts
          
          # Mostra TUDO em build/
          echo "📂 Full build directory structure:"
          find build -ls 2>/dev/null || echo "⚠️ build/ não encontrado"
          
          echo ""
          echo "📂 Content of build/bin/:"
          ls -lah build/bin/ || echo "⚠️ build/bin/ directory not found!"
          echo ""
          
          if [ "${{ matrix.goos }}" = "windows" ]; then
            echo "🪟 Processing Windows artifacts..."
            
            # Lista todos os .exe para debug
            echo "📋 All .exe files in build/bin/:"
            find build/bin -name "*.exe" -type f || true
            
            # Windows: executável + instalador NSIS
            if [ -f "build/bin/${{ matrix.output }}" ]; then
              echo "✅ Found executable: build/bin/${{ matrix.output }}"
              cp build/bin/${{ matrix.output }} artifacts/${ARTIFACT_NAME}.exe
            else
              echo "⚠️ Executable not found at: build/bin/${{ matrix.output }}"
            fi
            
            # Instalador NSIS - tenta vários padrões de nome
            INSTALLER_FOUND=false
            for installer in "build/bin/assistente-amd64-installer.exe" "build/bin/Assistente-Installer.exe" "build/bin/assistente-installer.exe" "build/bin/assistente-windows-amd64-installer.exe" "build/bin/"*-installer.exe "build/bin/"*Installer.exe; do
              if [ -f "$installer" ]; then
                echo "✅ Found installer: $installer"
                cp "$installer" artifacts/${ARTIFACT_NAME}-installer.exe
                INSTALLER_FOUND=true
                break
              fi
            done
            
            if [ "$INSTALLER_FOUND" = "false" ]; then
              echo "⚠️ No installer found. Build may have failed or NSIS not configured."
            fi
            
          else
            echo "🐧 Processing Linux artifacts..."
            
            # Linux: executável + AppImage
            if [ -f "build/bin/${{ matrix.output }}" ]; then
              echo "✅ Found executable: build/bin/${{ matrix.output }}"
              cp build/bin/${{ matrix.output }} artifacts/${ARTIFACT_NAME}
              chmod +x artifacts/${ARTIFACT_NAME}
            else
              echo "⚠️ Executable not found at: build/bin/${{ matrix.output }}"
            fi
            
            # AppImage - busca por qualquer arquivo .AppImage
            APPIMAGE_FOUND=false
            for appimage in build/bin/*.AppImage; do
              if [ -f "$appimage" ]; then
                echo "✅ Found AppImage: $appimage"
                cp "$appimage" artifacts/${ARTIFACT_NAME}.AppImage
                chmod +x artifacts/${ARTIFACT_NAME}.AppImage
                APPIMAGE_FOUND=true
                break
              fi
            done
            
            if [ "$APPIMAGE_FOUND" = "false" ]; then
              echo "⚠️ Nenhum AppImage encontrado. Apenas o executável será disponibilizado."
            fi
            
            # .deb se existir
            if [ -f "build/bin/assistente.deb" ]; then
              echo "✅ Found .deb: build/bin/assistente.deb"
              cp build/bin/assistente.deb artifacts/${ARTIFACT_NAME}.deb
            fi
          fi
          
          echo "📋 Final artifacts:"
          ls -lah artifacts/
          
          # Verifica se algum arquivo foi copiado
          ARTIFACT_COUNT=$(find artifacts -type f | wc -l)
          if [ "$ARTIFACT_COUNT" -eq 0 ]; then
            echo "⚠️ AVISO: Nenhum artifact foi copiado para o diretório artifacts/"
            echo "Isso pode indicar que o build falhou ou os arquivos não foram encontrados."
          else
            echo "✅ $ARTIFACT_COUNT arquivo(s) preparado(s) para upload"
          fi

      - name: Calculate checksums
        shell: bash
        working-directory: artifacts
        run: |
          echo "📋 Calculando checksums..."
          
          # Verifica se há arquivos
          if ! ls -A . 2>/dev/null | grep -q .; then
            echo "⚠️ Nenhum arquivo encontrado em artifacts/"
            echo "Isso pode acontecer se o build falhou."
            echo "Criando artifacts vazio para não bloquear o workflow..."
            echo "Build falhou ou não gerou artifacts" > README.txt
          fi
          
          echo "Arquivos encontrados:"
          ls -lah
          
          # Calcula checksums apenas de arquivos regulares
          for file in *; do
            # Ignora checksums.txt, README.txt e verifica se é arquivo regular
            if [ -f "$file" ] && [ ! -L "$file" ] && [ "$file" != "checksums.txt" ] && [ "$file" != "README.txt" ]; then
              echo "Calculando checksum de: $file"
              sha256sum "$file" >> checksums.txt || echo "⚠️ Erro ao calcular checksum de $file"
            fi
          done
          
          # Verifica se checksums.txt foi criado
          if [ -f "checksums.txt" ]; then
            echo "✅ Checksums gerados:"
            cat checksums.txt
          else
            echo "⚠️ Nenhum checksum foi gerado (sem arquivos para processar)"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.goos }}-${{ matrix.goarch }}
          path: artifacts/*

  release:
    needs: [build, build-cli]
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          
          # Consolida todos os builds (desktop + CLI)
          echo "📦 Consolidando artifacts..."
          for dir in artifacts/build-* artifacts/cli-*; do
            if [ -d "$dir" ]; then
              echo "Copiando de $dir"
              find "$dir" -type f -exec cp {} release-assets/ \;
            fi
          done
          
          # Remove checksums individuais e cria um consolidado
          rm -f release-assets/checksums.txt
          
          # Lista arquivos
          echo "📋 Arquivos preparados:"
          ls -lh release-assets/
          
          # Gera checksums consolidados
          echo "🔐 Gerando checksums..."
          cd release-assets
          for file in *; do
            if [ -f "$file" ]; then
              sha256sum "$file" >> checksums.txt
            fi
          done
          cat checksums.txt

      # Manifest não é mais necessário - o updater busca diretamente da API do GitHub

      - name: Verify release assets
        run: |
          echo "✅ Verificando assets..."
          if [ -z "$(ls -A release-assets)" ]; then
            echo "❌ ERRO: Nenhum asset encontrado em release-assets/"
            exit 1
          fi
          echo "Assets encontrados:"
          ls -lh release-assets/

      - name: Upload assets to existing release
        uses: softprops/action-gh-release@v1
        with:
          files: release-assets/*
          fail_on_unmatched_files: true

      # Push para GitHub Pages não é mais necessário

      - name: Summary
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          
          echo "✅ Release ${VERSION} publicado!"
          echo ""
          echo "📦 GitHub Release: https://github.com/inclunet/assistente/releases/tag/${VERSION}"
          echo "🔄 Auto-update detectará a nova versão automaticamente via GitHub API"

  cleanup:
    needs: [test, build, build-cli, release]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Remove release on failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "❌ Build ou upload de artefatos falhou. Removendo release ${TAG}..."
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || echo "⚠️ Não foi possível remover a release (pode já ter sido removida)"
          echo "🗑️ Release ${TAG} removida para evitar release sem artefatos."