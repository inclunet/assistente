name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Detector de corrida roda no agendamento noturno (job backend-race),
  # para não penalizar o tempo dos PRs.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backend:
    # Executa em push/PR e manualmente; o agendamento noturno cobre o job backend-race.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev xvfb

      - uses: actions/setup-go@v5
        with:
          # Fonte única de versão do Go: go.mod.
          go-version-file: go.mod

      - name: Go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

      - name: Go build
        run: go build ./...

      - name: Go tests (com cobertura)
        run: |
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          export DISPLAY=:99.0
          go test -covermode=atomic -coverprofile=coverage.out ./...

      - name: Relatório de cobertura (informativo)
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}')
          COVERAGE_NUM=${COVERAGE%\%}
          THRESHOLD=50
          echo "Cobertura total do backend: ${COVERAGE}"
          {
            echo "## Cobertura do backend"
            echo ""
            echo "- Cobertura total: **${COVERAGE}**"
            echo "- Threshold informativo: ${THRESHOLD}%"
          } >> "$GITHUB_STEP_SUMMARY"
          if awk "BEGIN { exit !(${COVERAGE_NUM} < ${THRESHOLD}) }"; then
            echo "::warning::Cobertura ${COVERAGE} abaixo do threshold informativo de ${THRESHOLD}% (não bloqueante)."
          fi

      - name: Upload do perfil de cobertura
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: backend-coverage
          path: coverage.out
          retention-days: 7

  backend-race:
    # Detector de corrida (mais lento): roda apenas no agendamento noturno e sob demanda,
    # mantendo os PRs rápidos.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev xvfb

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go tests (-race)
        run: |
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          export DISPLAY=:99.0
          go test -race ./...

  frontend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          # Fonte única de versão do Node: .nvmrc.
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint (includes jsx-a11y)
        run: npm run lint

      - name: Stylelint (design tokens)
        run: npm run lint:css

      - name: Tests (includes axe-core a11y)
        run: npm run test

      - name: Build (Vite) — falha se dist ficar vazio
        run: npm run build

  e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload e2e results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-results
          path: frontend/e2e-results/
          retention-days: 7
