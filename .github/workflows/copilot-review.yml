name: Request Copilot Review

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: copilot-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  request:
    name: Request Copilot review
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (!github.event.pull_request.draft &&
          github.event.pull_request.user.type != 'Bot')
      }}
    steps:
      - name: Request review from Copilot
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Solicitando review do Copilot para ${REPO}#${PR_NUMBER}"

          if [[ -z "${HEAD_SHA}" ]]; then
            HEAD_SHA="$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json headRefOid --jq '.headRefOid')"
          fi
          echo "Commit alvo (head SHA): ${HEAD_SHA}"

          # Mostra o último review do Copilot ANTES de solicitar, para servir de
          # base de comparação nos logs (ajuda a verificar se um novo review foi gerado).
          # OBS: capturamos a saída numa variável e checamos explicitamente, pois `jq`
          # sobre uma lista vazia sai com status 0 e não imprime nada — então um
          # `|| echo "(nenhum...)"` nunca dispararia no caso mais comum.
          echo "Reviews anteriores do Copilot (commit / estado):"
          prev_reviews="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
            --jq '.[] | select(.user.login == "copilot-pull-request-reviewer") | "  - " + .commit_id + " (" + .state + ")"' \
            2>/dev/null || true)"
          if [[ -n "${prev_reviews}" ]]; then
            echo "${prev_reviews}"
          else
            echo "  (nenhum review anterior do Copilot)"
          fi

          # IMPORTANTE: apenas re-postar o Copilot em requested_reviewers NÃO dispara
          # um novo review quando ele já revisou o PR — a API responde 2xx mas nada
          # acontece (no-op silencioso). Para forçar um review a cada commit, removemos
          # o Copilot dos reviewers pendentes (quando houver) e o adicionamos de novo,
          # garantindo a transição "não solicitado" -> "solicitado" que dispara o review.
          #
          # Consultamos primeiro os reviewers pendentes e só removemos se o Copilot
          # estiver lá. Assim evitamos o DELETE "às cegas" — cujo 422 de "reviewer
          # inexistente" era tratado como sucesso, mascarando erros reais (permissão,
          # rate limit, endpoint/param inválido) — e distinguimos "nada a remover" de
          # falhas inesperadas, abortando o job nestas últimas.
          echo "Consultando reviewers pendentes..."
          pending_json="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/requested_reviewers" 2>&1)" || {
            echo "Falha ao consultar reviewers pendentes:"
            echo "${pending_json}"
            exit 1
          }
          # O Copilot pode aparecer como "Copilot" ou "copilot-pull-request-reviewer".
          # Extraímos o login EXATO presente em pending_json (case-insensitive contra
          # essa lista conhecida) e o reutilizamos no DELETE. Isso evita: (a) falsos
          # positivos de um match por substring (ex.: usuário humano "copilotaria"); e
          # (b) remover com um login diferente do que está pendente — se o pendente for
          # "copilot-pull-request-reviewer" e mandássemos "Copilot", o DELETE devolveria
          # 422 e abortaria o job, impedindo o re-request que dispara o novo review.
          copilot_login="$(printf '%s' "${pending_json}" \
            | jq -r 'first(.users[]?.login | select((ascii_downcase) == "copilot" or (ascii_downcase) == "copilot-pull-request-reviewer")) // empty' 2>/dev/null || true)"

          if [[ -n "${copilot_login}" ]]; then
            echo "Copilot já está como reviewer pendente (login: ${copilot_login}); removendo para forçar um novo review..."
            if del_out="$(gh api \
              --method DELETE \
              "repos/${REPO}/pulls/${PR_NUMBER}/requested_reviewers" \
              -f "reviewers[]=${copilot_login}" 2>&1)"; then
              echo "Solicitação anterior do Copilot removida."
            else
              echo "Falha inesperada ao remover a solicitação de review do Copilot:"
              echo "${del_out}"
              exit 1
            fi
          else
            echo "Copilot não está como reviewer pendente; nada a remover."
          fi

          requested=0
          for attempt in 1 2 3; do
            if output=$(gh api \
              --method POST \
              "repos/${REPO}/pulls/${PR_NUMBER}/requested_reviewers" \
              -f "reviewers[]=Copilot" 2>&1); then
              echo "Review do Copilot solicitado para o commit ${HEAD_SHA}."
              requested=1
              break
            fi

            echo "${output}"
            if [[ "${output}" == *"already requested"* || "${output}" == *"Review request already exists"* ]]; then
              echo "Review do Copilot já está solicitado."
              requested=1
              break
            fi

            if [[ "${attempt}" != "3" ]]; then
              echo "Tentativa ${attempt} falhou; tentando novamente em instantes..."
              sleep 15
            else
              echo "Tentativa ${attempt} falhou."
              echo "Falha ao solicitar review do Copilot após 3 tentativas."
              echo "Verifique se o 'Copilot code review' está habilitado para o repositório"
              echo "(Settings -> Copilot -> Code review) e se a licença Copilot cobre o repositório."
              exit 1
            fi
          done

          # Verificação observável: lista os reviewers pendentes logo após solicitar.
          # OBS: o Copilot pode iniciar o review imediatamente e sair de "pendente",
          # então uma lista vazia aqui NÃO indica falha — é apenas diagnóstico.
          # Mesma armadilha do bloco de reviews anteriores: `jq` sobre lista vazia sai
          # com status 0 sem imprimir nada, então capturamos e checamos explicitamente.
          if [[ "${requested}" == "1" ]]; then
            echo "Reviewers pendentes após a solicitação:"
            pending_after="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/requested_reviewers" \
              --jq '.users[]?.login | "  - " + .' 2>/dev/null || true)"
            if [[ -n "${pending_after}" ]]; then
              echo "${pending_after}"
            else
              echo "  (nenhum reviewer pendente listado no momento)"
            fi
          fi
